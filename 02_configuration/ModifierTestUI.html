<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .form-row { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
      input[type="text"] { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
      input:disabled { background-color: #f2f2f2; color: #777; cursor: not-allowed; }
      button { padding: 10px 15px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background-color: #357AE8; }
      #status { margin-top: 15px; font-style: italic; }
    </style>
  </head>
  <body>
    <h4>Modifier les paramètres du test</h4>
    <div id="form-container">
      <p>Chargement des données...</p>
    </div>
    
    <div class="form-row">
      <button onclick="saveChanges()">Sauvegarder les modifications</button>
    </div>
    
    <div id="status"></div>
    
    <script>
      // Ces variables sont passées depuis le script côté serveur
      const rowIndex = <?= rowIndex ?>;

      // Au chargement de la sidebar, on récupère les données du test
      window.addEventListener('load', function() {
        google.script.run
          .withSuccessHandler(populateForm)
          .withFailureHandler(onFailure)
          .getTestDataForEdit(rowIndex);
      });

      // Fonction pour construire le formulaire avec les données reçues
      function populateForm(data) {
        const container = document.getElementById('form-container');
        container.innerHTML = ''; // Nettoyer le message de chargement

        // Liste des champs qui seront en lecture seule
        const readOnlyFields = [
          'Id_Unique', 'Nom_Fichier_Complet', 'Statut', 
          'Lien_Formulaire_Public', 'ID_Formulaire_Cible', 'ID_Sheet_Cible',
          'Accès Direct Formulaire'
          // Ajoutez d'autres en-têtes de colonne que vous voulez griser
        ];

        data.headers.forEach((header, index) => {
          if (!header) return; // Ignorer les colonnes sans en-tête

          const value = data.values[index];
          const isReadOnly = readOnlyFields.includes(header);

          const rowDiv = document.createElement('div');
          rowDiv.className = 'form-row';

          const label = document.createElement('label');
          label.textContent = header;
          
          const input = document.createElement('input');
          input.type = 'text';
          input.id = header;
          input.value = value;
          if (isReadOnly) {
            input.disabled = true;
          }

          rowDiv.appendChild(label);
          rowDiv.appendChild(input);
          container.appendChild(rowDiv);
        });
      }

      // Fonction appelée par le bouton "Sauvegarder"
      function saveChanges() {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = 'Sauvegarde en cours...';
        
        const updatedData = {};
        const inputs = document.querySelectorAll('#form-container input');
        
        inputs.forEach(input => {
          // On ne sauvegarde que les champs qui ne sont PAS désactivés
          if (!input.disabled) {
            updatedData[input.id] = input.value;
          }
        });

        google.script.run
          .withSuccessHandler(function(successMessage) {
            statusDiv.textContent = successMessage;
            // Ferme la sidebar après 2 secondes
            setTimeout(function() { google.script.host.close(); }, 2000);
          })
          .withFailureHandler(onFailure)
          .updateTestData(rowIndex, updatedData);
      }

      function onFailure(error) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = 'Erreur: ' + error.message;
        alert('Erreur: ' + error.message);
      }
    </script>
  </body>
</html>
